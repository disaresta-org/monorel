name: e2e-gitea

# End-to-end tests against a live Forgejo container (Forgejo is API-
# compatible with Gitea). The container is managed by
# testcontainers-go from inside the test process; the runner needs
# only a working Docker daemon (default on ubuntu-latest).
#
# Triggers:
#   push (main)         — full validation on every merge.
#   pull_request        — path-filtered to changes that could affect
#                         release detection / dispatch / provider-side
#                         contracts. See `paths:` below.
#   workflow_dispatch   — manual trigger for ad-hoc validation.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'cmd/monorel/**'
      - 'internal/cli/**'
      - 'internal/detect/**'
      - 'internal/orchestrator/**'
      - 'internal/release/**'
      - 'internal/provider/**'
      - 'internal/git/**'
      - 'config/**'
      - 'changeset/**'
      - 'plan/**'
      - 'semver/**'
      - 'changelog/**'
      - 'tests/e2e/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/e2e-gitea.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          # setup-go's built-in cache (default true since v4) already
          # covers ~/go/pkg/mod and ~/.cache/go-build, keyed on
          # go.sum. An explicit actions/cache@v4 step used to live
          # here on the same paths; it was redundant and produced two
          # post-action cache uploads at job teardown that ran in
          # parallel with each other.
          cache: true

      # testcontainers-go connects to /var/run/docker.sock from inside
      # the test process; ubuntu-latest ships Docker. If the daemon
      # were ever down, testcontainers returns a clear error of its
      # own when the first scenario calls forgejo.Run, so a separate
      # `docker info` preflight step would only duplicate that signal.
      - name: Run e2e suite
        run: go test -tags=e2e -count=1 -timeout 15m -v ./tests/e2e/...
