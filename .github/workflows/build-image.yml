name: build-image
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Always tag :latest for tag pushes; :vX.Y.Z and :vX.Y for
          # version pinning. workflow_dispatch only tags :latest.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            major_minor="${tag%.*}"
            echo "tags=${repo}:latest,${repo}:${tag},${repo}:${major_minor}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${repo}:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
