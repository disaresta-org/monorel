name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Skip on `chore(release):` push commits across every job that
  # resolves Go module versions (`test`, `lint`, `tidy`). PR runs
  # are unaffected because the filter checks `head_commit.message`
  # which is null for `pull_request` events.
  #
  # The dogfood: monorel's own `ci/github/README.md` documents this
  # recipe (Recipes -> "Skipping CI on chore(release) commits") for
  # downstream consumers; this workflow demonstrates it in monorel's
  # own setup. Today monorel is single-module so the chore(release)
  # commit doesn't add new versions to its go.sum and the race the
  # filter prevents wouldn't bite. Forward-compatible if monorel
  # ever grows sub-modules.
  test:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23', '1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './docs/node_modules/*' -not -path './node_modules/*'))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  tidy:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go mod tidy
      - run: |
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod / go.sum drift after tidy."
            exit 1
          fi

  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Use head.sha rather than HEAD: on PRs, the runner checks out a
      # synthetic test-merge commit at HEAD with subject `Merge <sha>
      # into <sha>`, which is not conventional-commits format and
      # always fails the parser. head.sha points at the PR branch's
      # actual tip.
      - run: bun scripts/lint-commit.mjs --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  docs-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd docs && bun install --frozen-lockfile
      - run: cd docs && bun run docs:build
