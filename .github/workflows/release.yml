name: release

# Cuts monorel's own release after the always-open release PR is merged.
# Self-hosted: this workflow is monorel-specific. Other consumers go
# through the disaresta-org/monorel/ci/github composite action, which
# wraps `monorel auto` (detect-release + tag + push + publish). Those
# repos don't run goreleaser themselves; their releases need monorel
# publish to set bodies and create the GitHub Release in the first
# place.
#
# Triggers:
#   push (main) — every push. The detect-release step decides which
#     path runs (release-side tag + push, or feature-side preview
#     --upsert), so no if-guard is needed at the job level.
#   workflow_dispatch — manual escape hatch (the v0.1.0 bootstrap path).
#
# Pipeline (release job):
#   1. monorel detect-release — exit 0 when HEAD is the release-PR
#                              merge commit (trailer or provider-API
#                              signal); exit 1 on a regular feature
#                              push.
#   2a. release path:
#       monorel tag           — read HEAD's monorel-Release: trailers
#                              (written by `monorel apply` on the
#                              staging branch upstream) and create per-
#                              package tags. The merge commit already
#                              has the file changes; only the tags
#                              still need creating.
#       git push --follow-tags — push the new tags to the remote.
#   2b. feature path:
#       monorel preview --upsert — refresh the always-open release PR
#                              against the new main tip.
#
# Notice the absence of `monorel publish`: monorel's own pipeline lets
# goreleaser (in build-binaries) create the GitHub Release in one step
# along with uploading binaries. v0.2.0 surfaced a fatal interaction
# between `monorel publish` and goreleaser's recent versions — once
# monorel publish creates the release, goreleaser's PATCH to attach
# binaries flips it to GitHub's new immutable-release state, and the
# upload then fails 422 ("Cannot upload assets to an immutable release").
# Even deleting the immutable release doesn't free the tag-name
# (GitHub permanently retains it). Letting goreleaser own release
# creation avoids the conflict entirely.
#
# That's why this workflow expands `monorel auto` into its constituent
# subcommands instead of calling it verbatim: auto's release path runs
# `tag + push + publish`, and we need to drop the trailing publish.
# Other consumers use the action wrapper, which calls `monorel auto`
# in full.
#
# Trade-off: monorel's own GitHub Release bodies are goreleaser's
# auto-generated commit list, not the curated CHANGELOG entry.
# CHANGELOG.md still gets the curated entry via `monorel apply` on the
# staging branch. Other consumers (loglayer-go) keep getting curated
# bodies because they call the action wrapper, which runs `monorel
# publish` after `monorel tag`.
#
# build-binaries and build-image fire as workflow_call jobs gated on
# the release job having cut a root-module (`vX.Y.Z`) tag. Both are
# called inline rather than via the natural tag-push event:
# secrets.GITHUB_TOKEN-driven tag pushes are subject to GitHub's
# anti-recursion rule and don't propagate to push-triggered workflows.
# The workflow_call path is the supported sidestep.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # contents:write to push tags (release path) and to force-push the
  # monorel/release branch (feature path).
  # pull-requests:write so monorel auto's feature path can PATCH the
  # always-open release PR via `monorel preview --upsert`. Lost when
  # release-pr.yml was consolidated into this workflow; without it,
  # the GitHub API returns 403 on every non-release push to main.
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      # Latest bare vX.Y.Z tag created by `monorel tag`. Empty when
      # the push wasn't a release merge (detect-release exited 1) or
      # when the release was sub-module-only (no root tag); the chained
      # build jobs skip themselves in that case. monorel itself is
      # single-package today, so this output is always set on a real
      # release; the empty-output path is forward-looking.
      root_tag: ${{ steps.root_tag.outputs.root_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Configure git author
        run: |
          set -euo pipefail
          git config user.name  "monorel-bot[automation]"
          git config user.email "monorel-bot@users.noreply.github.com"

      - name: monorel auto (release-only path; goreleaser owns publish)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # monorel itself omits the publish step on the release path
        # (goreleaser owns GitHub Release creation; see the v0.2
        # incident note at the top of this file). The feature path
        # has no publish step at all, so we delegate it to monorel
        # auto verbatim. Branch on detect-release's exit code:
        #   0 -- release commit; run tag + push --follow-tags
        #        inline (skips publish vs auto's release path).
        #   1 -- feature commit; delegate to monorel auto, which
        #        runs apply + force-push monorel/release + upsert.
        #   2 -- detection error (network, auth, repo state).
        #        Surface loudly rather than silently routing
        #        through the feature path.
        run: |
          set -euo pipefail
          set +e
          go run ./cmd/monorel detect-release
          ec=$?
          set -e
          case "$ec" in
            0)
              go run ./cmd/monorel tag
              git push --follow-tags
              ;;
            1)
              go run ./cmd/monorel auto
              ;;
            *)
              echo "::error::monorel detect-release failed with exit code $ec"
              exit "$ec"
              ;;
          esac

      - name: Capture root tag
        id: root_tag
        # Pick the latest bare vX.Y.Z tag that points at the just-
        # pushed release commit. Sub-module tags (path/vX.Y.Z) are
        # excluded by the regex; if none of the released tags match,
        # the output is empty and the chained build jobs skip. Also
        # empty when detect-release exited 1 (feature push), since
        # no new tags were created.
        run: |
          set -euo pipefail
          root_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "root_tag=${root_tag}" >> "$GITHUB_OUTPUT"
          if [ -n "$root_tag" ]; then
            echo "Root module released as $root_tag; chaining build-binaries + build-image."
          else
            echo "No root tag at HEAD; build-binaries + build-image will skip."
          fi

  deploy-docs:
    needs: release
    if: ${{ needs.release.result == 'success' }}
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  build-binaries:
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.root_tag != '' }}
    uses: ./.github/workflows/build-release-binaries.yml
    with:
      tag: ${{ needs.release.outputs.root_tag }}
    permissions:
      contents: write

  build-image:
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.root_tag != '' }}
    uses: ./.github/workflows/build-image.yml
    with:
      tag: ${{ needs.release.outputs.root_tag }}
    permissions:
      contents: read
      packages: write
