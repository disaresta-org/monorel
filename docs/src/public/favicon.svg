<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="monorel">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!--
    Compressed version of the hero motif. Three incoming railroads
    fan to a merge node; one gold railroad extends to the right.
    Each railroad is a pair of rails with two-three ties. Stays
    readable down to ~24x24; below that, the structure blurs into
    the navy background, but the colors still carry the brand.
  -->

  <!-- top input track -->
  <g transform="translate(38 32) rotate(25)">
    <line x1="-30" y1="-3" x2="-2" y2="-3" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-30" y1="3"  x2="-2" y2="3"  stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#475569">
      <rect x="-26" y="-4.5" width="1.4" height="9" rx="0.5"/>
      <rect x="-16" y="-4.5" width="1.4" height="9" rx="0.5"/>
      <rect x="-6"  y="-4.5" width="1.4" height="9" rx="0.5"/>
    </g>
  </g>
  <!-- middle input track -->
  <g transform="translate(38 32)">
    <line x1="-30" y1="-3" x2="-2" y2="-3" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-30" y1="3"  x2="-2" y2="3"  stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#94a3b8">
      <rect x="-26" y="-4.5" width="1.4" height="9" rx="0.5"/>
      <rect x="-16" y="-4.5" width="1.4" height="9" rx="0.5"/>
      <rect x="-6"  y="-4.5" width="1.4" height="9" rx="0.5"/>
    </g>
  </g>
  <!-- bottom input track -->
  <g transform="translate(38 32) rotate(-25)">
    <line x1="-30" y1="-3" x2="-2" y2="-3" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-30" y1="3"  x2="-2" y2="3"  stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#cbd5e1">
      <rect x="-26" y="-4.5" width="1.4" height="9" rx="0.5"/>
      <rect x="-16" y="-4.5" width="1.4" height="9" rx="0.5"/>
      <rect x="-6"  y="-4.5" width="1.4" height="9" rx="0.5"/>
    </g>
  </g>

  <!-- merge node hub -->
  <circle cx="38" cy="32" r="3.5" fill="#facc15"/>

  <!-- output track -->
  <g transform="translate(38 32)">
    <line x1="2" y1="-3" x2="22" y2="-3" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="3"  x2="22" y2="3"  stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
    <g fill="#facc15">
      <rect x="8"  y="-5" width="1.6" height="10" rx="0.5"/>
      <rect x="14" y="-5" width="1.6" height="10" rx="0.5"/>
      <rect x="20" y="-5" width="1.6" height="10" rx="0.5"/>
    </g>
  </g>
</svg>
