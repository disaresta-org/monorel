name: monorel
description: "Run monorel against the current repo. Commands: pr (upsert release PR), release (cut a release)."
author: disaresta-org
branding:
  icon: tag
  color: blue

inputs:
  command:
    description: "Either 'pr' (upsert / close the always-open release PR) or 'release' (cut a release on the current commit, push tags, publish provider releases)."
    required: true
  version:
    description: "monorel version to run, e.g. v1.2.3. Defaults to 'latest'."
    required: false
    default: latest
  config:
    description: "Path to monorel.toml relative to the repo root."
    required: false
    default: monorel.toml
  token:
    description: "Token used for provider API calls. Needs contents:write and pull-requests:write permissions on the workflow."
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Configure git author
      shell: bash
      run: |
        set -euo pipefail
        git config user.name  "monorel-bot[automation]"
        git config user.email "monorel-bot@users.noreply.github.com"

    - name: Resolve binary asset
      id: resolve
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux)   os=linux  ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
          *) echo "::error::unsupported runner OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
        esac
        if [ "$VERSION" = "latest" ]; then
          tag=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/disaresta-org/monorel/releases/latest" \
            | jq -r '.tag_name')
        else
          tag="$VERSION"
        fi
        if [ -z "$tag" ] || [ "$tag" = "null" ]; then
          echo "::error::could not resolve monorel version"
          exit 1
        fi
        ext=tar.gz
        [ "$os" = "windows" ] && ext=zip
        url="https://github.com/disaresta-org/monorel/releases/download/${tag}/monorel_${tag#v}_${os}_${arch}.${ext}"
        {
          echo "tag=$tag"
          echo "os=$os"
          echo "arch=$arch"
          echo "ext=$ext"
          echo "url=$url"
        } >> "$GITHUB_OUTPUT"

    - name: Download monorel
      shell: bash
      env:
        URL: ${{ steps.resolve.outputs.url }}
        EXT: ${{ steps.resolve.outputs.ext }}
      run: |
        set -euo pipefail
        tmp=$(mktemp -d)
        echo "downloading $URL"
        curl -fsSL "$URL" -o "$tmp/monorel.$EXT"
        case "$EXT" in
          tar.gz) tar -xzf "$tmp/monorel.$EXT" -C "$tmp" ;;
          zip)    unzip -q "$tmp/monorel.$EXT" -d "$tmp" ;;
        esac
        # Match by name only (Windows zip extraction doesn't preserve
        # the +x bit; the previous -perm filter dropped Windows).
        bin=$(find "$tmp" -maxdepth 2 -type f \( -name 'monorel' -o -name 'monorel.exe' \) | head -n1)
        if [ -z "$bin" ]; then
          echo "::error::extracted archive does not contain a monorel binary"
          ls -R "$tmp"
          exit 1
        fi
        case "$RUNNER_OS" in
          Windows)
            install -m 0755 "$bin" "$RUNNER_TEMP/monorel.exe"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/monorel.exe" --version
            ;;
          *)
            install -m 0755 "$bin" /usr/local/bin/monorel
            monorel --version
            ;;
        esac

    - name: Run monorel ${{ inputs.command }}
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        CONFIG: ${{ inputs.config }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        case "$COMMAND" in
          pr)
            # GitHub's PR-create API requires the head branch to exist
            # on the remote before opening a PR against it. Stage
            # monorel/release as a fast-forward of the default branch
            # plus one empty marker commit, then force-push so the
            # always-open release PR has somewhere to live.
            #
            # The branch's diff is empty (the rendered plan goes in the
            # PR body, not the branch). At merge time, the squash
            # commit's subject is the orchestrator-set PR title
            # (`chore(release): ...`), which release.yml uses to gate.
            #
            # If the orchestrator decides the plan is empty (no pending
            # changesets) it'll close any open release PR — the staged
            # branch is harmless leftover state in that case and gets
            # overwritten on the next non-empty plan.
            base="$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||' || true)"
            base="${base:-$(git rev-parse --abbrev-ref HEAD)}"
            git fetch --no-tags origin "$base"
            git branch -f monorel/release "origin/$base"
            git checkout -q monorel/release
            git -c commit.gpgsign=false commit --allow-empty \
              -m "chore(release): always-open release PR marker"
            git push -f origin monorel/release
            git checkout -q -

            monorel preview --config "$CONFIG" --upsert
            ;;
          release)
            # The post-merge release pipeline. Order matters:
            #   1. release: write CHANGELOGs, delete changesets,
            #      commit, create tags locally.
            #   2. push: send commits + tags to the remote.
            #   3. publish: create one provider release per tag, with
            #      the body sourced from each tag's CHANGELOG entry.
            # Splitting (1) and (3) ensures tags exist on the remote
            # before the provider tries to validate them.
            monorel release --config "$CONFIG"
            git push --follow-tags
            monorel publish --config "$CONFIG"
            ;;
          *)
            echo "::error::unknown command: $COMMAND (expected 'pr' or 'release')"
            exit 1
            ;;
        esac
