name: release-pr
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-pr:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # `monorel apply` runs `go mod tidy` (offline, against a seeded
      # local cache) so the release commit's go.sum is canonically
      # clean. Pin Go via the released module's directive.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: disaresta-org/monorel/ci/github@v0.11.0
        with:
          command: pr
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
