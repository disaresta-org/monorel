default:
  # The published image's entrypoint is `monorel` (it ships as an
  # entrypoint-binary container). GitLab's docker+machine executor
  # wraps every script as `sh -c '...'`, so without this override
  # the runner invokes `monorel sh -c '...'` and fails with
  # `unknown command "sh"`. Setting entrypoint to `[""]` clears the
  # container's entrypoint so the runner's shell wrapper takes over.
  image:
    name: ghcr.io/disaresta-org/monorel:1.0.0
    entrypoint: [""]

monorel:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GITLAB_TOKEN: $MONOREL_GITLAB_TOKEN
  script:
    - git config user.name  "monorel-bot[automation]"
    - git config user.email "monorel-bot@users.noreply.example.com"
    # Replace the runner's auto-cloned remote (which uses the
    # read-only CI_JOB_TOKEN) with MONOREL_GITLAB_TOKEN so that
    # `monorel auto`'s force-push to `monorel/release` and tag push
    # are both writeable.
    - git remote set-url origin "https://oauth2:${MONOREL_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - monorel auto
