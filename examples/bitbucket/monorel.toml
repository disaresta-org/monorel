# monorel configuration. See https://monorel.disaresta.com/configuration
#
# NOTE: the bitbucket provider is currently disabled in shipped
# monorel binaries (see ./README.md). `monorel validate` against
# this file will fail with `provider.name "bitbucket" is not
# recognized`. The example is preserved for the eventual
# re-enablement.

[provider]
name  = "bitbucket"
owner = "your-workspace"   # bitbucket workspace slug
repo  = "your-repo"

[packages."your-repo"]
tag_prefix = ""
path       = "."
changelog  = "CHANGELOG.md"

[packages."transports/foo"]
tag_prefix = "transports/foo"
path       = "transports/foo"
changelog  = "transports/foo/CHANGELOG.md"
